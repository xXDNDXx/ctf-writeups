site_name: ">_ CTF Write-ups"
site_description: >-
  Methodology-first penetration testing write-ups for Hack The Box and
  TryHackMe — every machine documented like a professional engagement:
  enumerate → understand → exploit → escalate → report.
site_url: https://xxdndxx.github.io/ctf-writeups/
repo_url: https://github.com/xXDNDXx/ctf-writeups
repo_name: xXDNDXx/ctf-writeups
edit_uri: edit/main/

# Site source lives in docs/ (writeups + homepage); hooks and config stay at root.
docs_dir: docs
site_dir: site

theme:
  name: material
  # OPFOR design layer: template overrides (fonts, social meta) live in overrides/
  custom_dir: overrides
  favicon: favicon.png
  logo: logo.png
  palette:
    # Dark scheme matching the hand-built walkthrough theme
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  # system fonts only — OPFOR layer (overrides/main.html) supplies Inter/JetBrains Mono
  font: false

extra_css:
  - stylesheets/opfor.css

extra_javascript:
  - javascripts/app.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xXDNDXx
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/daniel-dayan-a66322352/
      name: LinkedIn
    - icon: fontawesome/solid/globe
      link: https://xxdndxx.github.io
      name: Portfolio

hooks:
  - hooks/callouts.py
  - hooks/ops_index.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Methodology: methodology.md
  - HTB:
      - HTB/README.md
      - Easy:
          - HTB/Easy/README.md
          - Base: HTB/Easy/Base/README.md
      - Medium: HTB/Medium/README.md
      - Hard: HTB/Hard/README.md
      - Insane: HTB/Insane/README.md
  - THM:
      - THM/README.md
      - Easy: THM/Easy/README.md
      - Medium:
          - THM/Medium/README.md
          - Support: THM/Medium/Support/README.md
      - Hard: THM/Hard/README.md
      - Insane: THM/Insane/README.md
  - Contribute:
      - contributing.md
      - Write-up template: TEMPLATE.md

copyright: >-
  Daniel Dayan — educational use only. All write-ups cover retired Hack The
  Box machines and TryHackMe rooms. Nothing here may be used against systems
  without explicit written authorization.
